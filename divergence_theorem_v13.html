 function setText(el,text){
  if(lastText.get(el)===text)return;
  lastText.set(el,text);
  el.textContent=text;

 function trackDisposable(x){
  if(x)disposables.push(x);

 let T=null;

  build:BUILD,
  stop:false,
  cleaned:false,
  visible:true,
  animating:false,
  raf:0,
  lastTime:0,
  accumulator:0,
  renderer:null,
  observer:null,
  resizeObserver:null,
  stage,
  reattach,
  cleanup
 };
 window[STATE_KEY]=state;

 function reattach(newRoot){
  if(state.cleaned)return;
  if(stage.parentElement!==newRoot)newRoot.appendChild(stage);
  if(state.observer)state.observer.disconnect();
  if(state.resizeObserver)state.resizeObserver.disconnect();
  if(state.observer)state.observer.observe(stage);
  if(state.resizeObserver)state.resizeObserver.observe(stage);
  lastWidth=-1;
  lastHeight=-1;
  recalcRendererSize();
  render();
 }

 function cleanup(){
  if(state.cleaned)return;
  state.cleaned=true;
  state.stop=true;
  if(state.raf){
   cancelAnimationFrame(state.raf);
   state.raf=0;
  }
  if(state.observer)state.observer.disconnect();
  if(state.resizeObserver)state.resizeObserver.disconnect();
  for(let i=0;i<eventListeners.length;i++){
   const e=eventListeners[i];
   e.target.removeEventListener(e.type,e.listener,e.options);
  }
  if(surfaceGeom&&typeof surfaceGeom.dispose==="function")surfaceGeom.dispose();
  for(const d of new Set(disposables)){
   if(d&&typeof d.dispose==="function")d.dispose();
  }
  if(state.renderer){
   state.renderer.dispose();
   state.renderer.forceContextLoss();
  }
  stage.remove();
  delete window[STATE_KEY];
 }

 /* ============================================================

    ============================================================ */

 const STEP_MS=1000/QUALITY.targetFPS;
 const FIELD_VERSION="g_v20";

 const R=0.70;

 const RADIAL_A=1.15;
 const UNIFORM_F=1.00;

 const PAR_FMIN=0.08;
 const PAR_A=0.35;
 const PAR_BETA=1.15;

 const ETA_CONST=1.00;
 const CONST_SOURCE_D=2.00;

 const INCOMP_U=1.15;
 const INCOMP_A=0.35;

 const FIELD_EXT=1.08;
 const XMIN=-1.35;
 const XMAX=1.55;
 const YLIM=1.40;
 const ZLIM=1.40;

 const PARTICLE_COUNT=96;
 const FLOW_SPEED=1.00;

 const GRID_NX=5;
 const GRID_NY=5;
 const GRID_NZ=3;

 const VECTOR_LMAX=0.40;
 const VECTOR_MHALF=0.55;

 const PARAM_KEY=
  `R=${R}|RAD=${RADIAL_A}|UNI=${UNIFORM_F}` +
  `|PFMIN=${PAR_FMIN}|PA=${PAR_A}|PBETA=${PAR_BETA}` +
  `|ETA=${ETA_CONST}|CMD=${CONST_SOURCE_D}` +
  `|IU=${INCOMP_U}|IA=${INCOMP_A}`;

 let activeMode=3;

 const field={z:0,gx:0,gy:0,gz:0,div:0};

 function evaluate(x,y,z,withGradient,modeOverride){
  const mode=modeOverride===undefined?activeMode:modeOverride;
  const r2=x*x+y*y+z*z;

  if(mode===0){
   field.z=0.5*RADIAL_A*r2;
   if(withGradient){
    field.gx=RADIAL_A*x;
    field.gy=RADIAL_A*y;
    field.gz=RADIAL_A*z;
    field.div=3*RADIAL_A;
   }
   return field;
  }

  if(mode===1){
   field.z=-0.5*RADIAL_A*r2;
   if(withGradient){
    field.gx=-RADIAL_A*x;
    field.gy=-RADIAL_A*y;
    field.gz=-RADIAL_A*z;
    field.div=-3*RADIAL_A;
   }
   return field;
  }

  if(mode===2){
   field.z=UNIFORM_F*x;
   if(withGradient){
    field.gx=UNIFORM_F;
    field.gy=0;
    field.gz=0;
    field.div=0;
   }
   return field;
  }

  if(mode===3){
   const ex=Math.exp(PAR_BETA*x);
   field.z=PAR_FMIN*x+(PAR_A/PAR_BETA)*ex;
   if(withGradient){
    field.gx=PAR_FMIN+PAR_A*ex;
    field.gy=0;
    field.gz=0;
    field.div=PAR_A*PAR_BETA*ex;
   }
   return field;
  }

  if(mode===4){
   const dx=x+CONST_SOURCE_D;
   const rho2=dx*dx+y*y+z*z;
   const rho=Math.sqrt(rho2);
   const invRho=1/rho;
   field.z=ETA_CONST*rho;
   if(withGradient){
    field.gx=ETA_CONST*dx*invRho;
    field.gy=ETA_CONST*y*invRho;
    field.gz=ETA_CONST*z*invRho;
    field.div=2*ETA_CONST*invRho;
   }
   return field;
  }

  field.z=INCOMP_U*x+INCOMP_A*(x*x-0.5*y*y-0.5*z*z);
  if(withGradient){
   field.gx=INCOMP_U+2*INCOMP_A*x;
   field.gy=-INCOMP_A*y;
   field.gz=-INCOMP_A*z;
   field.div=0;
  }
  return field;
 }

 function fieldScale(mode){
  if(mode===0||mode===1)return RADIAL_A*R;
  if(mode===2)return UNIFORM_F;
  if(mode===3)return PAR_FMIN+PAR_A*Math.exp(PAR_BETA*XMAX);
  if(mode===4)return ETA_CONST;
  const fxMax=INCOMP_U+2*INCOMP_A*R;
  const transverse=INCOMP_A*R;
  return Math.sqrt(fxMax*fxMax+2*transverse*transverse);
 }

 function saturatedLength(m){
  return VECTOR_LMAX*m/(m+VECTOR_MHALF);
 }

 function formatSigned(v){
  if(Math.abs(v)<5e-12)return "0.000";
  return `${v>0?"+":""}${v.toFixed(3)}`;

 function hash01(n){
  const s=Math.sin(n*127.1+311.7)*43758.5453123;
  return s-Math.floor(s);

 /* ============================================================
    GEOMETRIAS CANONICAS
    Cada uma e um "triangle soup" (sem indices) com normais por
    vertice. Todas sao estreladas em relacao a origem canonica,
    o que garante que a decomposicao em tetraedros (centro -> face)
    cubra exatamente o volume.
    ============================================================ */

 const PYR_A=0.62;
 const PYR_ZB=-0.45;
 const PYR_ZT=1.00;

 const CYL_HX=0.80;
 const CYL_R=0.60;

 /* meia-aresta escolhida para o cubo caber na mesma esfera unitaria
    das outras geometrias: h*sqrt(3)=1 */
 const CUBE_H=1/Math.sqrt(3);

 function irregRadiusRaw(theta,phi){
  return 1
   +0.26*Math.sin(3*phi)*Math.sin(theta)
   +0.20*Math.cos(2*theta)
   +0.14*Math.cos(phi)*Math.sin(2*theta);
 }

 const IRREG_MAX=cached(`irregMax|${FIELD_VERSION}`,()=>{
  let m=0;
  for(let i=0;i<=180;i++){
   const th=Math.PI*i/180;
   for(let j=0;j<=180;j++){
    const ph=2*Math.PI*j/180;
    const r=irregRadiusRaw(th,ph);
    if(r>m)m=r;
   }
  }
  return m;
 });

 function irregRadius(theta,phi){
  return irregRadiusRaw(theta,phi)/IRREG_MAX;
 }

 function makeSoup(){
  return {p:[],n:[]};
 }

 function pushTri(S,ax,ay,az,bx,by,bz,cx,cy,cz,nax,nay,naz,nbx,nby,nbz,ncx,ncy,ncz){
  S.p.push(ax,ay,az,bx,by,bz,cx,cy,cz);
  S.n.push(nax,nay,naz,nbx,nby,nbz,ncx,ncy,ncz);
 }

 function pushFlatTri(S,ax,ay,az,bx,by,bz,cx,cy,cz){
  const e1x=bx-ax,e1y=by-ay,e1z=bz-az;
  const e2x=cx-ax,e2y=cy-ay,e2z=cz-az;
  let nx=e1y*e2z-e1z*e2y;
  let ny=e1z*e2x-e1x*e2z;
  let nz=e1x*e2y-e1y*e2x;
  const m=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;
  nx/=m; ny/=m; nz/=m;
  pushTri(S,ax,ay,az,bx,by,bz,cx,cy,cz,nx,ny,nz,nx,ny,nz,nx,ny,nz);
 }

 /* subdivide cada triangulo em 4, preservando as normais.
    usado nas faces planas para dar resolucao de cor suficiente. */
 function subdivideSoup(S,levels){
  let cur=S;
  for(let L=0;L<levels;L++){
   const out=makeSoup();
   const P=cur.p;
   const N=cur.n;
   for(let t=0;t<P.length;t+=9){
    const ax=P[t],ay=P[t+1],az=P[t+2];
    const bx=P[t+3],by=P[t+4],bz=P[t+5];
    const cx=P[t+6],cy=P[t+7],cz=P[t+8];
    const nax=N[t],nay=N[t+1],naz=N[t+2];
    const nbx=N[t+3],nby=N[t+4],nbz=N[t+5];
    const ncx=N[t+6],ncy=N[t+7],ncz=N[t+8];

    const abx=0.5*(ax+bx),aby=0.5*(ay+by),abz=0.5*(az+bz);
    const bcx=0.5*(bx+cx),bcy=0.5*(by+cy),bcz=0.5*(bz+cz);
    const cax=0.5*(cx+ax),cay=0.5*(cy+ay),caz=0.5*(cz+az);

    function mid(n1x,n1y,n1z,n2x,n2y,n2z){
     let mx=0.5*(n1x+n2x),my=0.5*(n1y+n2y),mz=0.5*(n1z+n2z);
     const m=Math.sqrt(mx*mx+my*my+mz*mz)||1;
     return [mx/m,my/m,mz/m];
    }
    const nab=mid(nax,nay,naz,nbx,nby,nbz);
    const nbc=mid(nbx,nby,nbz,ncx,ncy,ncz);
    const nca=mid(ncx,ncy,ncz,nax,nay,naz);

    pushTri(out,ax,ay,az,abx,aby,abz,cax,cay,caz,nax,nay,naz,nab[0],nab[1],nab[2],nca[0],nca[1],nca[2]);
    pushTri(out,abx,aby,abz,bx,by,bz,bcx,bcy,bcz,nab[0],nab[1],nab[2],nbx,nby,nbz,nbc[0],nbc[1],nbc[2]);
    pushTri(out,cax,cay,caz,bcx,bcy,bcz,cx,cy,cz,nca[0],nca[1],nca[2],nbc[0],nbc[1],nbc[2],ncx,ncy,ncz);
    pushTri(out,abx,aby,abz,bcx,bcy,bcz,cax,cay,caz,nab[0],nab[1],nab[2],nbc[0],nbc[1],nbc[2],nca[0],nca[1],nca[2]);
   }
   cur=out;
  }
  return cur;
 }

 /* Um poliedro inscrito subestima o volume da esfera lisa (erro ~0.7% em
    SEG=24). SPH_K corrige o raio para que o volume do poliedro seja
    exatamente 4pi/3, de modo que os numeros exibidos batam com as
    formulas analiticas que o aluno calcula na mao. Mesma ideia em CYL_K
    para a secao poligonal do cilindro. */
 const SPH_K=cached(`sphK|${FIELD_VERSION}|SEG=${QUALITY.geomSegments}`,()=>{
  const LAT=QUALITY.geomSegments;
  const LON=LAT*2;
  let v=0;
  function pt(i,j){
   const th=Math.PI*i/LAT;
   const ph=2*Math.PI*j/LON;
   const st=Math.sin(th);
   return [st*Math.cos(ph),st*Math.sin(ph),Math.cos(th)];
  }
  function tv(a,b,c){
   return (a[0]*(b[1]*c[2]-b[2]*c[1])-a[1]*(b[0]*c[2]-b[2]*c[0])+a[2]*(b[0]*c[1]-b[1]*c[0]))/6;
  }
  for(let i=0;i<LAT;i++){
   for(let j=0;j<LON;j++){
    const a=pt(i,j),b=pt(i+1,j),c=pt(i,j+1),d=pt(i+1,j+1);
    if(i!==0)v+=tv(a,b,c);
    if(i!==LAT-1)v+=tv(c,b,d);
   }
  }
  return Math.cbrt((4*Math.PI/3)/Math.abs(v));
 });

 const CYL_K=cached(`cylK|${FIELD_VERSION}|SEG=${QUALITY.geomSegments}`,()=>{
  const LON=QUALITY.geomSegments*2;
  return Math.sqrt(Math.PI/((LON/2)*Math.sin(2*Math.PI/LON)));
 });

 function buildSphereSoup(){
  const LAT=QUALITY.geomSegments;
  const LON=LAT*2;
  const S=makeSoup();
  function pt(i,j){
   const th=Math.PI*i/LAT;
   const ph=2*Math.PI*j/LON;
   const st=SPH_K*Math.sin(th);
   return [st*Math.cos(ph),st*Math.sin(ph),SPH_K*Math.cos(th)];
  }
  for(let i=0;i<LAT;i++){
   for(let j=0;j<LON;j++){
    const a=pt(i,j),b=pt(i+1,j),c=pt(i,j+1),d=pt(i+1,j+1);
    if(i!==0){
     pushTri(S,a[0],a[1],a[2],b[0],b[1],b[2],c[0],c[1],c[2],
               a[0],a[1],a[2],b[0],b[1],b[2],c[0],c[1],c[2]);
    }
    if(i!==LAT-1){
     pushTri(S,c[0],c[1],c[2],b[0],b[1],b[2],d[0],d[1],d[2],
               c[0],c[1],c[2],b[0],b[1],b[2],d[0],d[1],d[2]);
    }
   }
  }
  return S;
 }

 function irregPoint(th,ph){
  const r=irregRadius(th,ph);
  const st=Math.sin(th);
  return [r*st*Math.cos(ph),r*st*Math.sin(ph),r*Math.cos(th)];
 }

 function irregNormal(th,ph){
  const e=1e-3;
  const t0=Math.min(Math.max(th,e),Math.PI-e);
  const p1=irregPoint(t0+e,ph);
  const p2=irregPoint(t0-e,ph);
  const p3=irregPoint(t0,ph+e);
  const p4=irregPoint(t0,ph-e);
  const ux=p1[0]-p2[0],uy=p1[1]-p2[1],uz=p1[2]-p2[2];
  const vx=p3[0]-p4[0],vy=p3[1]-p4[1],vz=p3[2]-p4[2];
  let nx=uy*vz-uz*vy;
  let ny=uz*vx-ux*vz;
  let nz=ux*vy-uy*vx;
  const m=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;
  nx/=m; ny/=m; nz/=m;
  const p0=irregPoint(t0,ph);
  if(nx*p0[0]+ny*p0[1]+nz*p0[2]<0){ nx=-nx; ny=-ny; nz=-nz; }
  return [nx,ny,nz];
 }

 function buildIrregularSoup(){
  const LAT=QUALITY.geomSegments;
  const LON=LAT*2;
  const S=makeSoup();
  function pn(i,j){
   const th=Math.PI*i/LAT;
   const ph=2*Math.PI*j/LON;
   return [irregPoint(th,ph),irregNormal(th,ph)];
  }
  for(let i=0;i<LAT;i++){
   for(let j=0;j<LON;j++){
    const A=pn(i,j),B=pn(i+1,j),C=pn(i,j+1),D=pn(i+1,j+1);
    if(i!==0){
     pushTri(S,A[0][0],A[0][1],A[0][2],B[0][0],B[0][1],B[0][2],C[0][0],C[0][1],C[0][2],
               A[1][0],A[1][1],A[1][2],B[1][0],B[1][1],B[1][2],C[1][0],C[1][1],C[1][2]);
    }
    if(i!==LAT-1){
     pushTri(S,C[0][0],C[0][1],C[0][2],B[0][0],B[0][1],B[0][2],D[0][0],D[0][1],D[0][2],
               C[1][0],C[1][1],C[1][2],B[1][0],B[1][1],B[1][2],D[1][0],D[1][1],D[1][2]);
    }
   }
  }
  return S;
 }

 function buildCubeSoup(){
  const h=CUBE_H;
  const S=makeSoup();
  /* cada face com os vertices em sentido anti-horario visto de fora */
  function quad(v0,v1,v2,v3){
   pushFlatTri(S,v0[0],v0[1],v0[2],v1[0],v1[1],v1[2],v2[0],v2[1],v2[2]);
   pushFlatTri(S,v0[0],v0[1],v0[2],v2[0],v2[1],v2[2],v3[0],v3[1],v3[2]);
  }
  quad([ h,-h,-h],[ h, h,-h],[ h, h, h],[ h,-h, h]);
  quad([-h, h,-h],[-h,-h,-h],[-h,-h, h],[-h, h, h]);
  quad([ h, h,-h],[-h, h,-h],[-h, h, h],[ h, h, h]);
  quad([-h,-h,-h],[ h,-h,-h],[ h,-h, h],[-h,-h, h]);
  quad([-h,-h, h],[ h,-h, h],[ h, h, h],[-h, h, h]);
  quad([ h,-h,-h],[-h,-h,-h],[-h, h,-h],[ h, h,-h]);
  return subdivideSoup(S,3);
 }

 function buildPyramidSoup(){
  const a=PYR_A;
  const zb=PYR_ZB;
  const S=makeSoup();
  const c0=[ a, a,zb];
  const c1=[-a, a,zb];
  const c2=[-a,-a,zb];
  const c3=[ a,-a,zb];
  const ap=[0,0,PYR_ZT];
  const sides=[[c0,c1],[c1,c2],[c2,c3],[c3,c0]];
  for(let i=0;i<4;i++){
   const u=sides[i][0],v=sides[i][1];
   pushFlatTri(S,u[0],u[1],u[2],v[0],v[1],v[2],ap[0],ap[1],ap[2]);
  }
  pushFlatTri(S,c0[0],c0[1],c0[2],c2[0],c2[1],c2[2],c1[0],c1[1],c1[2]);
  pushFlatTri(S,c0[0],c0[1],c0[2],c3[0],c3[1],c3[2],c2[0],c2[1],c2[2]);
  return subdivideSoup(S,3);
 }

 function buildCylinderSoup(){
  const LON=QUALITY.geomSegments*2;
  const NX=8;
  const S=makeSoup();
  const CR=CYL_R*CYL_K;

  for(let i=0;i<NX;i++){
   const x0=-CYL_HX+2*CYL_HX*i/NX;
   const x1=-CYL_HX+2*CYL_HX*(i+1)/NX;
   for(let j=0;j<LON;j++){
    const a0=2*Math.PI*j/LON;
    const a1=2*Math.PI*(j+1)/LON;
    const c0=Math.cos(a0),s0=Math.sin(a0);
    const c1=Math.cos(a1),s1=Math.sin(a1);
    const A=[x0,CR*c0,CR*s0];
    const B=[x1,CR*c0,CR*s0];
    const C=[x0,CR*c1,CR*s1];
    const D=[x1,CR*c1,CR*s1];
    pushTri(S,A[0],A[1],A[2],C[0],C[1],C[2],B[0],B[1],B[2],
              0,c0,s0, 0,c1,s1, 0,c0,s0);
    pushTri(S,C[0],C[1],C[2],D[0],D[1],D[2],B[0],B[1],B[2],
              0,c1,s1, 0,c1,s1, 0,c0,s0);
   }
  }

  const capS=makeSoup();
  for(let j=0;j<LON;j++){
   const a0=2*Math.PI*j/LON;
   const a1=2*Math.PI*(j+1)/LON;
   const c0=Math.cos(a0),s0=Math.sin(a0);
   const c1=Math.cos(a1),s1=Math.sin(a1);
   pushTri(capS,CYL_HX,0,0,CYL_HX,CR*c0,CR*s0,CYL_HX,CR*c1,CR*s1,
                1,0,0, 1,0,0, 1,0,0);
   pushTri(capS,-CYL_HX,0,0,-CYL_HX,CR*c1,CR*s1,-CYL_HX,CR*c0,CR*s0,
                -1,0,0, -1,0,0, -1,0,0);
  }
  const capSub=subdivideSoup(capS,2);
  for(let i=0;i<capSub.p.length;i++){
   S.p.push(capSub.p[i]);
   S.n.push(capSub.n[i]);
  }
  return S;
 }

 /* garante orientacao outward: se o volume assinado ficar negativo,
    inverte o winding de todos os triangulos. */
 function orientOutward(pos,nrm){
  let vol=0;
  for(let t=0;t<pos.length;t+=9){
   const ax=pos[t],ay=pos[t+1],az=pos[t+2];
   const bx=pos[t+3],by=pos[t+4],bz=pos[t+5];
   const cx=pos[t+6],cy=pos[t+7],cz=pos[t+8];
   vol+=(ax*(by*cz-bz*cy)-ay*(bx*cz-bz*cx)+az*(bx*cy-by*cx))/6;
  }
  if(vol>=0)return;
  for(let t=0;t<pos.length;t+=9){
   for(let k=0;k<3;k++){
    const tmp=pos[t+3+k]; pos[t+3+k]=pos[t+6+k]; pos[t+6+k]=tmp;
    const tn=nrm[t+3+k]; nrm[t+3+k]=nrm[t+6+k]; nrm[t+6+k]=tn;
   }
  }
 }

 function getCanonicalGeometry(kind){
  return cached(`geom|${FIELD_VERSION}|${kind}|SEG=${QUALITY.geomSegments}`,()=>{
   let S;
   if(kind==="sphere")S=buildSphereSoup();
   else if(kind==="cube")S=buildCubeSoup();
   else if(kind==="pyramid")S=buildPyramidSoup();
   else if(kind==="cylinder")S=buildCylinderSoup();
   else S=buildIrregularSoup();

   const pos=new Float32Array(S.p);
   const nrm=new Float32Array(S.n);
   orientOutward(pos,nrm);

   let boundRadius=0;
   for(let i=0;i<pos.length;i+=3){
    const d=Math.sqrt(pos[i]*pos[i]+pos[i+1]*pos[i+1]+pos[i+2]*pos[i+2]);
    if(d>boundRadius)boundRadius=d;
   }

   return {pos,nrm,vertexCount:pos.length/3,triCount:pos.length/9,boundRadius};
  });
 }

 function insideCanonical(kind,x,y,z){
  if(kind==="sphere")return x*x+y*y+z*z<=SPH_K*SPH_K;
  if(kind==="cube")return Math.abs(x)<=CUBE_H&&Math.abs(y)<=CUBE_H&&Math.abs(z)<=CUBE_H;
  if(kind==="cylinder"){const cr=CYL_R*CYL_K;return Math.abs(x)<=CYL_HX&&(y*y+z*z)<=cr*cr;}
  if(kind==="pyramid"){
   if(z<PYR_ZB||z>PYR_ZT)return false;
   const t=(PYR_ZT-z)/(PYR_ZT-PYR_ZB);
   const half=PYR_A*t;
   return Math.abs(x)<=half&&Math.abs(y)<=half;
  }
  const rho=Math.sqrt(x*x+y*y+z*z);
  if(rho<1e-9)return true;
  const th=Math.acos(Math.max(-1,Math.min(1,z/rho)));
  const ph=Math.atan2(y,x);
  return rho<=irregRadius(th,ph);
 }

    ESTADO DA TRANSFORMACAO

 const SIZE_FACTORS=[1.00,0.60,0.30];
 const SIZE_LABELS=["100%","60%","30%"];
 const X_VIS=1.60;
 const Z_VIS=1.25;

 let geomKindIdx=0;
 let sizeIdx=0;
 let xPosIdx=1;
 let zPosIdx=1;
 let rotating=false;
 let rotAngle=0;
 const ROT_SPEED=0.42;

 let canon=null;
 let worldPos=null;
 let worldNrm=null;
 let colorArr=null;
 let dotArr=null;

 let posAttr=null;
 let nrmAttr=null;
 let colAttr=null;

 let centerX=0;
 let centerZ=0;
 let scaleCur=R;

 let fluxValue=0;
 let volValue=0;
 let volumeValue=0;
 let colorMaxAbs=1;

 function currentScale(){
  return R*SIZE_FACTORS[sizeIdx];
 }

 function boundR(){
  return canon.boundRadius*currentScale();
 }

 /* esquerda: tangente ao limite visual em -x
    centro:    centrado na origem
    direita:   tangente ao limite visual em +x
    (simetrico: o deslocamento e o mesmo dos dois lados) */
 function xPositions(){
  const rb=boundR();
  return [-(X_VIS-rb),0,X_VIS-rb];
 }

 function zPositions(){
  const rb=boundR();
  const hi=Math.max(0,Z_VIS-rb);
  return [-hi,0,hi];
 }

 function recomputeCenter(){
  scaleCur=currentScale();
  centerX=xPositions()[xPosIdx];
  centerZ=zPositions()[zPosIdx];
 }

 /* rotacao em torno do eixo y, passando pelo centro da geometria */
 function rotApply(x,y,z,out){
  const c=Math.cos(rotAngle);
  const s=Math.sin(rotAngle);
  out[0]=c*x+s*z;
  out[1]=y;
  out[2]=-s*x+c*z;
 }

 function rotApplyInv(x,y,z,out){
  const c=Math.cos(rotAngle);
  const s=Math.sin(rotAngle);
  out[0]=c*x-s*z;
  out[1]=y;
  out[2]=s*x+c*z;
 }

 const tmp3=[0,0,0];

 function insideWorld(x,y,z){
  const lx=(x-centerX)/scaleCur;
  const ly=y/scaleCur;
  const lz=(z-centerZ)/scaleCur;
  rotApplyInv(lx,ly,lz,tmp3);
  return insideCanonical(GEOM_KINDS[geomKindIdx],tmp3[0],tmp3[1],tmp3[2]);
 }

 /* ============================================================
    MUNDO + CORES
    ============================================================ */

 const NEUTRAL=[0.70,0.72,0.76];
 const BLUE=[0.22,0.48,1.00];
 const RED=[1.00,0.30,0.34];

 function updateWorldGeometry(){
  const n=canon.vertexCount;
  const c=Math.cos(rotAngle);
  const s=Math.sin(rotAngle);

  for(let i=0;i<n;i++){
   const j=i*3;
   const px=canon.pos[j],py=canon.pos[j+1],pz=canon.pos[j+2];
   const rx=c*px+s*pz;
   const rz=-s*px+c*pz;
   worldPos[j]=centerX+scaleCur*rx;
   worldPos[j+1]=scaleCur*py;
   worldPos[j+2]=centerZ+scaleCur*rz;

   const nx=canon.nrm[j],ny=canon.nrm[j+1],nz=canon.nrm[j+2];
   worldNrm[j]=c*nx+s*nz;
   worldNrm[j+1]=ny;
   worldNrm[j+2]=-s*nx+c*nz;
  }
 }

 function updateSurfaceColors(){
  const n=canon.vertexCount;
  let maxAbs=0;
  const buf=dotArr;

  for(let i=0;i<n;i++){
   const j=i*3;
   evaluate(worldPos[j],worldPos[j+1],worldPos[j+2],true);
   const d=field.gx*worldNrm[j]+field.gy*worldNrm[j+1]+field.gz*worldNrm[j+2];
   buf[i]=d;
   const ad=Math.abs(d);
   if(ad>maxAbs)maxAbs=ad;
  }

  colorMaxAbs=maxAbs||1;
  const inv=1/colorMaxAbs;

  for(let i=0;i<n;i++){
   const rel=buf[i]*inv;
   const t=Math.pow(Math.abs(rel),0.62);
   const tgt=rel>=0?BLUE:RED;
   const j=i*3;
   colorArr[j]=NEUTRAL[0]+(tgt[0]-NEUTRAL[0])*t;
   colorArr[j+1]=NEUTRAL[1]+(tgt[1]-NEUTRAL[1])*t;
   colorArr[j+2]=NEUTRAL[2]+(tgt[2]-NEUTRAL[2])*t;
  }
 }

 /* ============================================================
    INTEGRAIS NUMERICAS
    superficie: regra de 3 pontos por triangulo (exata ate grau 2)
    volume:     tetraedros centro->face, regra de 4 pontos
    ============================================================ */

 const TRI_Q=[
  [2/3,1/6,1/6],
  [1/6,2/3,1/6],
  [1/6,1/6,2/3]
 ];
 const TET_A=0.5854101966249685;
 const TET_B=0.1381966011250105;
 const TET_Q=[
  [TET_A,TET_B,TET_B,TET_B],
  [TET_B,TET_A,TET_B,TET_B],
  [TET_B,TET_B,TET_A,TET_B],
  [TET_B,TET_B,TET_B,TET_A]
 ];

 function computeIntegrals(){
  let flux=0;
  let volInt=0;
  let vol=0;

  const P=worldPos;
  const cx=centerX;
  const cy=0;
  const cz=centerZ;

  for(let t=0;t<P.length;t+=9){
   const ax=P[t],ay=P[t+1],az=P[t+2];
   const bx=P[t+3],by=P[t+4],bz=P[t+5];
   const gx=P[t+6],gy=P[t+7],gz=P[t+8];

   const e1x=bx-ax,e1y=by-ay,e1z=bz-az;
   const e2x=gx-ax,e2y=gy-ay,e2z=gz-az;
   let nx=e1y*e2z-e1z*e2y;
   let ny=e1z*e2x-e1x*e2z;
   let nz=e1x*e2y-e1y*e2x;
   const twoA=Math.sqrt(nx*nx+ny*ny+nz*nz);
   if(twoA>1e-14){
    const area=0.5*twoA;
    nx/=twoA; ny/=twoA; nz/=twoA;
    for(let q=0;q<3;q++){
     const w=TRI_Q[q];
     const qx=w[0]*ax+w[1]*bx+w[2]*gx;
     const qy=w[0]*ay+w[1]*by+w[2]*gy;
     const qz=w[0]*az+w[1]*bz+w[2]*gz;
     evaluate(qx,qy,qz,true);
     flux+=(field.gx*nx+field.gy*ny+field.gz*nz)*area/3;
    }
   }

   const d0x=ax-cx,d0y=ay-cy,d0z=az-cz;
   const d1x=bx-cx,d1y=by-cy,d1z=bz-cz;
   const d2x=gx-cx,d2y=gy-cy,d2z=gz-cz;
   const vt=(d0x*(d1y*d2z-d1z*d2y)-d0y*(d1x*d2z-d1z*d2x)+d0z*(d1x*d2y-d1y*d2x))/6;
   vol+=vt;
   if(Math.abs(vt)>1e-16){
    for(let q=0;q<4;q++){
     const w=TET_Q[q];
     const qx=w[0]*cx+w[1]*ax+w[2]*bx+w[3]*gx;
     const qy=w[0]*cy+w[1]*ay+w[2]*by+w[3]*gy;
     const qz=w[0]*cz+w[1]*az+w[2]*bz+w[3]*gz;
     evaluate(qx,qy,qz,true);
     volInt+=field.div*vt/4;
    }
   }
  }

  fluxValue=flux;
  volValue=volInt;
  volumeValue=vol;
 }

 function updateBalanceHUD(){
  /* as duas integrais sao calculadas de forma independente e coincidem ate
     ~1e-5 relativo, entao um unico numero representa honestamente as duas. */
  setText(theoremEl,

 function mapX(x){

 function mapZ(z){

 function drawMiniArrow(ctx,x0,z0,x1,z1,color){
  const dx=x1-x0;
  const dz=z1-z0;
  const mag=Math.sqrt(dx*dx+dz*dz);
  if(mag<1e-6)return;
  const ux=dx/mag;
  const uz=dz/mag;
  const px=-uz;
  const pz=ux;
  const hl=4.4;
  const hw=2.6;
  ctx.beginPath();
  ctx.moveTo(x0,z0);
  ctx.lineTo(x1,z1);
  ctx.strokeStyle=color;
  ctx.lineWidth=1.35;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x1,z1);
  ctx.lineTo(x1-hl*ux+hw*px,z1-hl*uz+hw*pz);
  ctx.lineTo(x1-hl*ux-hw*px,z1-hl*uz-hw*pz);
  ctx.closePath();
  ctx.fillStyle=color;
  ctx.fill();
 }

 function drawMiniAxes(ctx){
  const ox=17;
  const oy=QUALITY.mapSize-16;
  drawMiniArrow(ctx,ox,oy,ox+18,oy,"rgba(255,255,255,.88)");
  drawMiniArrow(ctx,ox,oy,ox,oy-18,"rgba(255,255,255,.88)");
  ctx.fillStyle="rgba(255,255,255,.94)";
  ctx.font="bold 10px ui-monospace,monospace";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText("x",ox+25,oy);
  ctx.fillText("z",ox,oy-25);
 }

 function traceMiniBranch(ctx,seedX,seedZ,direction,mode){
  let x=seedX;
  let z=seedZ;
  const ds=0.05;
  const scale=fieldScale(mode);
  for(let step=0;step<110;step++){
   if(Math.abs(x)>1.70||Math.abs(z)>1.70)break;
   evaluate(x,0,z,true,mode);
   const fx0=field.gx;
   const fz0=field.gz;
   const mag0=Math.sqrt(fx0*fx0+fz0*fz0);
   if(mag0<=scale*1e-12)break;
   const ux0=direction*fx0/mag0;
   const uz0=direction*fz0/mag0;
   const mx=x+0.5*ds*ux0;
   const mz=z+0.5*ds*uz0;
   evaluate(mx,0,mz,true,mode);
   const fxm=field.gx;
   const fzm=field.gz;
   const magm=Math.sqrt(fxm*fxm+fzm*fzm);
   if(magm<=scale*1e-12)break;
   const x1=x+direction*ds*fxm/magm;
   const z1=z+direction*ds*fzm/magm;
   ctx.beginPath();
   ctx.moveTo(mapX(x),mapZ(z));
   ctx.lineTo(mapX(x1),mapZ(z1));
   ctx.strokeStyle="rgba(17,180,255,.62)";
   ctx.lineWidth=1.1;
   ctx.stroke();
   if(step===20||step===55||step===88){
    if(direction>0)drawMiniArrow(ctx,mapX(x),mapZ(z),mapX(x1),mapZ(z1),"rgba(17,180,255,.9)");
    else drawMiniArrow(ctx,mapX(x1),mapZ(z1),mapX(x),mapZ(z),"rgba(17,180,255,.9)");
   }
   x=x1;
   z=z1;
  }
 }

 /* fundo do minimapa: apenas o fundo escuro, as linhas de campo e os eixos.
    A pintura do produto escalar vem depois, projetando a propria superficie. */
 function buildMinimapBase(mode){
  return cached(`minimapBase|${FIELD_VERSION}|mode=${mode}|SIZE=${QUALITY.mapSize}|EXT=${MAP_EXT}|${PARAM_KEY}`,()=>{
   let c;
   if(typeof OffscreenCanvas!=="undefined"){
    c=new OffscreenCanvas(QUALITY.mapSize,QUALITY.mapSize);
   }else{
    c=stage.createEl("canvas");
    c.width=QUALITY.mapSize;
    c.height=QUALITY.mapSize;
    c.style.display="none";
   }
   const ctx=c.getContext("2d",{alpha:false});
   if(ctx){
    ctx.fillStyle="rgb(16,18,24)";
    ctx.fillRect(0,0,QUALITY.mapSize,QUALITY.mapSize);

    if(mode===0||mode===1){
     for(let i=0;i<10;i++){
      const angle=2*Math.PI*i/10;
      traceMiniBranch(ctx,0.18*Math.cos(angle),0.18*Math.sin(angle),1,mode);
      traceMiniBranch(ctx,0.18*Math.cos(angle),0.18*Math.sin(angle),-1,mode);
     }
    }else{
     for(let i=0;i<7;i++){
      const sz=-1.05+0.35*i;
      traceMiniBranch(ctx,0,sz,1,mode);
      traceMiniBranch(ctx,0,sz,-1,mode);
     }
    }

    drawMiniAxes(ctx);
   }
   if(c instanceof HTMLElement)c.remove();
   return c;
  });
 }

 /* contorno da secao transversal em y=0, por marcha radial */
 function drawSectionOutline(ctx){
  const N=84;
  const tMax=boundR()*1.35+1e-6;
  ctx.beginPath();
  let started=false;
  for(let i=0;i<=N;i++){
   const a=2*Math.PI*i/N;
   const dx=Math.cos(a);
   const dz=Math.sin(a);
   let lo=0;
   let hi=tMax;
   if(!insideWorld(centerX,0,centerZ))break;
   for(let k=0;k<20;k++){
    const mid=0.5*(lo+hi);
    if(insideWorld(centerX+mid*dx,0,centerZ+mid*dz))lo=mid;
    else hi=mid;
   }
   const px=mapX(centerX+lo*dx);
   const pz=mapZ(centerZ+lo*dz);
   if(!started){ ctx.moveTo(px,pz); started=true; }
   else ctx.lineTo(px,pz);
  }
  if(started){
   ctx.closePath();
   ctx.strokeStyle="rgba(255,255,255,.92)";
   ctx.lineWidth=1.5;
   ctx.stroke();
  }
 }

 /* Projeta a superficie no plano (x,z) olhando ao longo de +y e pinta cada
    triangulo com o seu F.n medio, na mesma escala da barra de cores 3D.
    Desenha so as faces voltadas para +y: para um solido fechado elas cobrem
    a projecao exatamente uma vez, o que dispensa ordenar por profundidade. */
 function drawSurfaceProjection(ctx){
  if(!worldPos||!dotArr)return;
  const P=worldPos;
  const N=worldNrm;
  const inv=1/(colorMaxAbs||1);
  ctx.save();
  ctx.globalAlpha=0.9;
  for(let t=0;t<P.length;t+=9){
   const ny=N[t+1]+N[t+4]+N[t+7];
   if(ny<=0)continue;
   const vi=t/3;
   const rel=Math.max(-1,Math.min(1,(dotArr[vi]+dotArr[vi+1]+dotArr[vi+2])*inv/3));
   const w=Math.pow(Math.abs(rel),0.62);
   const tgt=rel>=0?BLUE:RED;
   const rr=Math.round(255*(NEUTRAL[0]+(tgt[0]-NEUTRAL[0])*w));
   const gg=Math.round(255*(NEUTRAL[1]+(tgt[1]-NEUTRAL[1])*w));
   const bb=Math.round(255*(NEUTRAL[2]+(tgt[2]-NEUTRAL[2])*w));
   const col=`rgb(${rr},${gg},${bb})`;
   ctx.beginPath();
   ctx.moveTo(mapX(P[t]),mapZ(P[t+2]));
   ctx.lineTo(mapX(P[t+3]),mapZ(P[t+5]));
   ctx.lineTo(mapX(P[t+6]),mapZ(P[t+8]));
   ctx.closePath();
   ctx.fillStyle=col;
   ctx.fill();
   /* o stroke fecha as costuras de antialiasing entre triangulos vizinhos */
   ctx.strokeStyle=col;
   ctx.lineWidth=1;
   ctx.stroke();
  }
  ctx.restore();
 }

 function drawOverlayView(){
  if(!mapCtx||!mapBase)return;
  mapCtx.drawImage(mapBase,0,0);
  drawSurfaceProjection(mapCtx);
  drawSectionOutline(mapCtx);
  if(selectedValid){
   mapCtx.beginPath();
   mapCtx.arc(mapX(selWorld[0]),mapZ(selWorld[2]),3.2,0,Math.PI*2);
   mapCtx.fillStyle="#F03A3A";
   mapCtx.fill();
  }
 }

 function recalcRendererSize(){
  if(!renderer||!camera||state.cleaned)return false;
  const rect=stage.getBoundingClientRect();
  const width=Math.max(1,Math.floor(rect.width));
  const height=Math.max(1,Math.floor(rect.height));
  if(width===lastWidth&&height===lastHeight)return false;
  lastWidth=width;
  lastHeight=height;
  renderer.setSize(width,height,false);
  camera.aspect=width/height;
  camera.updateProjectionMatrix();
  return true;
 }

 function flushDynamicRanges(){
  if(particleAttr&&particleDirtyMax>=particleDirtyMin){
   particleAttr.updateRange.offset=particleDirtyMin*3;
   particleAttr.updateRange.count=(particleDirtyMax-particleDirtyMin+1)*3;
   particleAttr.needsUpdate=true;
   particleDirtyMin=Infinity;
   particleDirtyMax=-1;
  }
 }

 function render(){
  if(!renderer||!scene||!camera||state.cleaned||state.stop)return;
  flushDynamicRanges();
  if(overlayDirty){
   drawOverlayView();
   overlayDirty=false;
  }
  renderer.render(scene,camera);
 }

 function updateCamera(){
  const cp=Math.cos(cameraPitch);
  camera.position.set(
   cameraDistance*cp*Math.cos(cameraYaw),
   cameraDistance*cp*Math.sin(cameraYaw),
   cameraDistance*Math.sin(cameraPitch)
  );
  camera.lookAt(0,0,0);
  if(keyLight){
   keyLight.position.copy(camera.position);
   keyLight.position.z+=2.0;
  }
 }

 function setFieldArrow(arrow,x,y,z,fx,fy,fz){
  const mag=Math.sqrt(fx*fx+fy*fy+fz*fz);

  arrow.position.set(x,y,z);

 /* ============================================================
    PARTICULAS
    ============================================================ */

 function hashSample(index,offset){
  return hash01(index*37.17+offset*71.91);
 }

 function resetParticle(i,initial){
  const count=particleRespawnCount[i];
  particleRespawnCount[i]=count+1;
  const seed=i+count*19;
  const h1=hashSample(seed,0.11);
  const h2=hashSample(seed,0.29);
  const h3=hashSample(seed,0.47);
  const h4=hashSample(seed,0.73);
  const h5=hashSample(seed,0.91);
  const dst=i*3;
  let x=0,y=0,z=0;

  if(activeMode===0){
   const zz=2*h1-1;
   const phi=2*Math.PI*h2;
   const rr=initial?(0.05+0.58*Math.cbrt(h3)):(0.05+0.16*Math.cbrt(h3));
   const xy=Math.sqrt(1-zz*zz);
   x=rr*xy*Math.cos(phi);
   y=rr*xy*Math.sin(phi);
   z=rr*zz;
   particleLife[i]=88+Math.floor(52*h4);
  }else if(activeMode===1){
   const zz=2*h1-1;
   const phi=2*Math.PI*h2;
   const rr=initial?(0.48+0.82*h3):(1.05+0.18*h3);
   const xy=Math.sqrt(1-zz*zz);
   x=rr*xy*Math.cos(phi);
   y=rr*xy*Math.sin(phi);
   z=rr*zz;
   particleLife[i]=90+Math.floor(55*h4);
  }else{
   const inner=h1<0.74;
   const maxR=inner?0.58:1.05;
   const rr=maxR*Math.sqrt(h2);
   const phi=2*Math.PI*h3;
   x=initial?(XMIN+(XMAX-XMIN)*h4):(XMIN-0.08*h4);
   y=rr*Math.cos(phi);
   z=rr*Math.sin(phi);
   particleLife[i]=92+Math.floor(72*h5);
  }

  particlePositions[dst]=x;
  particlePositions[dst+1]=y;
  particlePositions[dst+2]=z;
  particleAge[i]=0;
  particleSpeed[i]=0.78+0.42*h5;
  if(i<particleDirtyMin)particleDirtyMin=i;
  if(i>particleDirtyMax)particleDirtyMax=i;
 }

 function resetAllParticles(){
  for(let i=0;i<PARTICLE_COUNT;i++)resetParticle(i,true);
  overlayDirty=true;
 }

 function simulateStep(){
  const baseH=(STEP_MS/1000)*FLOW_SPEED;
  for(let i=0;i<PARTICLE_COUNT;i++){
   const dst=i*3;
   const oldX=particlePositions[dst];
   const oldY=particlePositions[dst+1];
   const oldZ=particlePositions[dst+2];

   evaluate(oldX,oldY,oldZ,true);
   const fx=field.gx;
   const fy=field.gy;
   const fz=field.gz;

   const h=baseH*particleSpeed[i];
   const newX=oldX+h*fx;
   const newY=oldY+h*fy;
   const newZ=oldZ+h*fz;
   particleAge[i]++;

   const radius2=newX*newX+newY*newY+newZ*newZ;
   let respawn=false;

   if(activeMode===0){
    respawn=radius2>1.45*1.45||particleAge[i]>=particleLife[i];
   }else if(activeMode===1){
    respawn=radius2<0.035*0.035||particleAge[i]>=particleLife[i];
   }else if(activeMode===3){
    respawn=newX>XMAX||newX<XMIN-0.25||Math.abs(newY)>YLIM||Math.abs(newZ)>ZLIM;
   }else{
    respawn=newX>XMAX||newX<XMIN-0.25||Math.abs(newY)>YLIM||Math.abs(newZ)>ZLIM||particleAge[i]>=particleLife[i];
   }

   if(respawn){
    resetParticle(i,false);
    continue;
   }

   particlePositions[dst]=newX;
   particlePositions[dst+1]=newY;
   particlePositions[dst+2]=newZ;
   if(i<particleDirtyMin)particleDirtyMin=i;
   if(i>particleDirtyMax)particleDirtyMax=i;
  }
 }

 /* ============================================================
    SETAS DE CAMPO (grade fixa, so depende do modo)
    ============================================================ */

 function getArrowRaw(mode){
  return cached(`arrows|${FIELD_VERSION}|mode=${mode}|${PARAM_KEY}|NX=${GRID_NX}|NY=${GRID_NY}|NZ=${GRID_NZ}|EXT=${FIELD_EXT}`,()=>{
   const pts=[];
   for(let iz=0;iz<GRID_NZ;iz++){
    const z=-0.75*FIELD_EXT+(1.50*FIELD_EXT*iz/(GRID_NZ-1));
    for(let iy=0;iy<GRID_NY;iy++){
     const y=-FIELD_EXT+(2*FIELD_EXT*iy/(GRID_NY-1));
     for(let ix=0;ix<GRID_NX;ix++){
      const x=-1.15*FIELD_EXT+(2.30*FIELD_EXT*ix/(GRID_NX-1));
      pts.push(x,y,z);
     }
    }
   }
   const pointCount=pts.length/3;
   const arrows=new Float32Array(pointCount*18);
   const scale=fieldScale(mode);
   let w=0;
   for(let i=0;i<pointCount;i++){
    const j=i*3;
    const x=pts[j],y=pts[j+1],z=pts[j+2];
    evaluate(x,y,z,true,mode);
    const fx=field.gx,fy=field.gy,fz=field.gz;
    const mag=Math.sqrt(fx*fx+fy*fy+fz*fz);
    if(mag<=scale*1e-12){
     for(let q=0;q<18;q+=3){ arrows[w++]=x; arrows[w++]=y; arrows[w++]=z; }
     continue;
    }
    const invMag=1/mag;
    const dx=fx*invMag,dy=fy*invMag,dz=fz*invMag;
    const L=0.90*saturatedLength(mag/scale);
    const hx=x+L*dx,hy=y+L*dy,hz=z+L*dz;
    let ax=0,ay=0,az=1;
    if(Math.abs(dz)>0.86){ ay=1; az=0; }
    let ux=dy*az-dz*ay;
    let uy=dz*ax-dx*az;
    let uz=dx*ay-dy*ax;
    const uMag=Math.sqrt(ux*ux+uy*uy+uz*uz)||1;
    ux/=uMag; uy/=uMag; uz/=uMag;
    const headL=0.30*L;
    const headW=0.13*L;
    arrows[w++]=x; arrows[w++]=y; arrows[w++]=z;
    arrows[w++]=hx; arrows[w++]=hy; arrows[w++]=hz;
    arrows[w++]=hx; arrows[w++]=hy; arrows[w++]=hz;
    arrows[w++]=hx-headL*dx+headW*ux;
    arrows[w++]=hy-headL*dy+headW*uy;
    arrows[w++]=hz-headL*dz+headW*uz;
    arrows[w++]=hx; arrows[w++]=hy; arrows[w++]=hz;
    arrows[w++]=hx-headL*dx-headW*ux;
    arrows[w++]=hy-headL*dy-headW*uy;
    arrows[w++]=hz-headL*dz-headW*uz;
   }
   return arrows;
  });
 }

 function rebuildMeshBuffers(){

  canon=getCanonicalGeometry(kind);

  worldPos=new Float32Array(n*3);
  worldNrm=new Float32Array(n*3);
  colorArr=new Float32Array(n*3);
  dotArr=new Float32Array(n);

  if(surfaceGeom){
   surfaceMesh.geometry=null;
   surfaceGeom.dispose();
  }

  surfaceGeom=new T.BufferGeometry();
  posAttr=new T.BufferAttribute(worldPos,3);
  nrmAttr=new T.BufferAttribute(worldNrm,3);
  colAttr=new T.BufferAttribute(colorArr,3);
  posAttr.setUsage(T.DynamicDrawUsage);
  nrmAttr.setUsage(T.DynamicDrawUsage);
  colAttr.setUsage(T.DynamicDrawUsage);
  surfaceGeom.setAttribute("position",posAttr);
  surfaceGeom.setAttribute("normal",nrmAttr);
  surfaceGeom.setAttribute("color",colAttr);
  surfaceGeom.boundingSphere=new T.Sphere(new T.Vector3(0,0,0),4);

 }

 function canAnimate(){
  return (state.animating||rotating)&&state.visible&&document.visibilityState==="visible"&&!state.stop;
 }

 function updatePlayStatus(){
  setText(playBtnRef,state.animating?"\u275A\u275A":"\u25B6");
 }

 function stopRaf(){
  if(state.raf){
   cancelAnimationFrame(state.raf);
   state.raf=0;
  }
  state.lastTime=0;
 }

 function ensureRaf(){
  if(!canAnimate()||state.raf)return;
  state.lastTime=0;
  state.raf=requestAnimationFrame(frame);
 }

 let rotFrameCount=0;

 function frame(now){
  state.raf=0;
  if(!canAnimate())return;

  if(state.lastTime===0){
   state.lastTime=now;
   state.raf=requestAnimationFrame(frame);
   return;
  }

  let delta=now-state.lastTime;
  state.lastTime=now;
  if(delta>STEP_MS*4)delta=STEP_MS*4;

  let advanced=false;

  if(state.animating){
   state.accumulator+=delta;
   if(state.accumulator>STEP_MS*4)state.accumulator=STEP_MS*4;
   while(state.accumulator>=STEP_MS){
    simulateStep();
    state.accumulator-=STEP_MS;
    advanced=true;
   }
  }

  if(rotating){
   rotAngle+=ROT_SPEED*delta/1000;
   if(rotAngle>2*Math.PI)rotAngle-=2*Math.PI;
   rotFrameCount++;
   // medido em ~0.5 ms/quadro: da para recalcular as integrais a cada 2 quadros.
   applyGeometryState(rotFrameCount%2===0);
   advanced=true;
  }

  if(advanced)render();
  if(canAnimate())state.raf=requestAnimationFrame(frame);
 }

 function showFatal(message){
  if(state.cleaned||fatalShown)return;
  fatalShown=true;
  state.stop=true;
  state.animating=false;
  rotating=false;
  if(state.raf){
   cancelAnimationFrame(state.raf);
   state.raf=0;
  }
  playBtnRef.disabled=true;
  resetBtnRef.disabled=true;
  rotBtnRef.disabled=true;
  setText(playBtnRef,"\u25B6");
  loading.remove();
  const errorDiv=stage.createEl("div");
  errorDiv.style.cssText=
   "position:absolute;left:12px;right:12px;top:50%;transform:translateY(-50%);" +
   "z-index:30;padding:10px;border-radius:8px;background:rgba(64,12,18,.88);" +
   "border:1px solid rgba(240,58,58,.55);font:12px/1.4 ui-monospace,monospace;color:#FFE7EA";
  setText(errorDiv,message);
 }

 function normalizeThreeNamespace(candidate){
  if(candidate&&String(candidate.REVISION)==="128"&&typeof candidate.WebGLRenderer==="function"&&typeof candidate.Scene==="function"&&typeof candidate.BufferGeometry==="function")return candidate;
  if(candidate&&candidate.default&&String(candidate.default.REVISION)==="128"&&typeof candidate.default.WebGLRenderer==="function")return candidate.default;
  if(candidate&&candidate.THREE&&String(candidate.THREE.REVISION)==="128"&&typeof candidate.THREE.WebGLRenderer==="function")return candidate.THREE;
  return null;
 }

 function restoreThreeGlobal(hadOwnThree,savedThree){
  if(hadOwnThree){
   window.THREE=savedThree;
  }else{
   try{ delete window.THREE; }catch(_err){ window.THREE=undefined; }
  }
 }

 function loadThreeViaClassicScript(){
  return new Promise((resolve,reject)=>{
   const hadOwnThree=Object.prototype.hasOwnProperty.call(window,"THREE");
   const savedThree=window.THREE;
   const oldScript=document.querySelector('script[data-viz-three-r128="1"]');
   if(oldScript)oldScript.remove();
   const script=document.head.createEl("script");
   script.src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
   script.async=true;
   script.dataset.vizThreeR128="1";
   const onLoad=()=>{
    const loaded=normalizeThreeNamespace(window.THREE);
    restoreThreeGlobal(hadOwnThree,savedThree);
    if(loaded)resolve(loaded);
    else reject(new Error("THREE r128 carregou, mas WebGLRenderer nao ficou disponivel."));
   };
   const onError=()=>{
    restoreThreeGlobal(hadOwnThree,savedThree);
    reject(new Error("Falha ao carregar THREE r128 pelo cdnjs."));
   };
   addListener(script,"load",onLoad,{once:true});
   addListener(script,"error",onError,{once:true});
  });
 }

 async function loadThreeViaIsolatedFallback(){
  const url="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
  const response=await fetch(url,{cache:"force-cache"});
  if(!response.ok)throw new Error(`Fallback THREE r128 falhou: HTTP ${response.status}.`);
  const source=await response.text();
  const hadOwnThree=Object.prototype.hasOwnProperty.call(window,"THREE");
  const savedThree=window.THREE;
  let loaded=null;
  try{
   const execute=new Function("module","exports","define",`${source}\nreturn globalThis.THREE;`);
   loaded=normalizeThreeNamespace(execute.call(window,undefined,undefined,undefined));
  }finally{
   restoreThreeGlobal(hadOwnThree,savedThree);
  }
  if(!loaded)throw new Error("THREE r128 foi obtido, mas WebGLRenderer continua indisponivel.");
  return loaded;
 }

 function createFreshThreePromise(){
  const p=loadThreeViaClassicScript().catch(()=>loadThreeViaIsolatedFallback()).then(candidate=>{
   const normalized=normalizeThreeNamespace(candidate);
   if(!normalized)throw new Error("Namespace THREE r128 invalido.");
   return normalized;
  });
  window.__threeR128LoadPromise=p;
  threeLoadPromise=p;
  return p;
 }

 function loadThreeR128(){
  const direct=normalizeThreeNamespace(window.THREE);
  if(direct){
   if(!window.__threeR128LoadPromise)window.__threeR128LoadPromise=Promise.resolve(direct);
   threeLoadPromise=window.__threeR128LoadPromise;
   return Promise.resolve(threeLoadPromise).then(candidate=>normalizeThreeNamespace(candidate)||direct).catch(()=>direct);
  }
  const existing=window.__threeR128LoadPromise;
  if(existing){
   const checked=Promise.resolve(existing).then(candidate=>{
    const normalized=normalizeThreeNamespace(candidate);
    if(normalized)return normalized;
    if(window.__threeR128LoadPromise===existing)window.__threeR128LoadPromise=undefined;
    return createFreshThreePromise();
   }).catch(()=>{
    if(window.__threeR128LoadPromise===existing)window.__threeR128LoadPromise=undefined;
    return createFreshThreePromise();
   });
   window.__threeR128LoadPromise=checked;
   threeLoadPromise=checked;
   return checked;
  }
  return createFreshThreePromise();
 }

 function trackObjectResources(obj){
  obj.traverse(o=>{
   if(o.geometry)trackDisposable(o.geometry);
   const m=o.material;
   if(Array.isArray(m)){
    for(let i=0;i<m.length;i++){
     trackDisposable(m[i]);
     if(m[i]&&m[i].map)trackDisposable(m[i].map);
    }
   }else if(m){
    trackDisposable(m);
    if(m.map)trackDisposable(m.map);
   }
  });
 }

 function freezeStatic(obj){
  obj.traverse(o=>{
   o.updateMatrix();
   o.matrixAutoUpdate=false;
  });
 }

 function emphasizeArrow(arrow){
  arrow.traverse(o=>{
   o.renderOrder=12;
   if(o.material){
    o.material.transparent=true;
    o.material.opacity=1;
    o.material.depthTest=false;
    o.material.depthWrite=false;
   }
  });
 }

 function createAxisLabel(text,color){
  const c=stage.createEl("canvas");
  c.width=64;
  c.height=64;
  c.style.display="none";
  const ctx=c.getContext("2d",{alpha:true});
  if(ctx){
   ctx.clearRect(0,0,64,64);
   ctx.fillStyle=color;
   ctx.font="bold 42px ui-monospace,monospace";
   ctx.textAlign="center";
   ctx.textBaseline="middle";
   ctx.fillText(text,32,32);
  }
  const tex=new T.CanvasTexture(c);
  tex.needsUpdate=true;
  const mat=new T.SpriteMaterial({map:tex,transparent:true,depthTest:false});
  const sprite=new T.Sprite(mat);
  sprite.scale.set(0.145,0.145,0.145);
  c.remove();
  trackDisposable(tex);
  trackDisposable(mat);
  return sprite;
 }

 /* ============================================================
    INIT
    ============================================================ */

 function initThree(candidate){
  if(state.cleaned||state.stop)return;
  const THREE=normalizeThreeNamespace(candidate);
  if(!THREE){
   showFatal("THREE r128 foi carregado, porem WebGLRenderer nao foi encontrado.");
   return;
  }
  T=THREE;

  try{
   renderer=new T.WebGLRenderer({
    alpha:true,
    antialias:false,
    depth:true,
    stencil:false,
    powerPreference:"high-performance"
   });
  }catch(err){
   showFatal(`WebGL nao pode ser inicializado: ${err&&err.message?err.message:String(err)}`);
   return;
  }

  state.renderer=renderer;
  renderer.setPixelRatio(QUALITY.pixelRatio);
  renderer.setClearColor(0x000000,0);
  renderer.outputEncoding=T.sRGBEncoding;
  renderer.domElement.style.cssText=
   "position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none";
  stage.appendChild(renderer.domElement);

  scene=new T.Scene();
  camera=new T.PerspectiveCamera(38,1,0.05,20);
  camera.up.set(0,0,1);

  scene.add(new T.AmbientLight(0xffffff,0.5));
  keyLight=new T.DirectionalLight(0xffffff,0.6);
  scene.add(keyLight);
  scene.add(keyLight.target);

  updateCamera();

  /* ---------- SUPERFICIE ---------- */

  const surfaceMat=trackDisposable(new T.MeshLambertMaterial({
   vertexColors:true,
   transparent:true,
   opacity:0.92,
   depthWrite:false,
   side:T.FrontSide
  }));

  surfaceMesh=new T.Mesh(new T.BufferGeometry(),surfaceMat);
  surfaceMesh.renderOrder=2;
  surfaceMesh.frustumCulled=false;
  scene.add(surfaceMesh);

  rebuildMeshBuffers();

  /* ---------- SETAS DE CAMPO ---------- */

  const arr0=getArrowRaw(activeMode);
  fieldArrowArray=new Float32Array(arr0.length);
  fieldArrowArray.set(arr0);
  fieldArrowGeom=new T.BufferGeometry();
  fieldArrowAttr=new T.BufferAttribute(fieldArrowArray,3);
  fieldArrowAttr.setUsage(T.DynamicDrawUsage);
  fieldArrowGeom.setAttribute("position",fieldArrowAttr);
  fieldArrowGeom.boundingSphere=new T.Sphere(new T.Vector3(0,0,0),3.0);
  trackDisposable(fieldArrowGeom);

  const fieldArrowMat=trackDisposable(new T.LineBasicMaterial({
   color:0x11B4FF,
   transparent:true,
   opacity:0.7,
   depthWrite:false
  }));

  const fieldArrowObj=new T.LineSegments(fieldArrowGeom,fieldArrowMat);
  fieldArrowObj.frustumCulled=false;
  fieldArrowObj.renderOrder=1;
  fieldArrowObj.updateMatrix();
  fieldArrowObj.matrixAutoUpdate=false;
  scene.add(fieldArrowObj);

  /* ---------- PARTICULAS ---------- */

  particlePositions=new Float32Array(PARTICLE_COUNT*3);
  particleAge=new Uint16Array(PARTICLE_COUNT);
  particleLife=new Uint16Array(PARTICLE_COUNT);
  particleRespawnCount=new Uint16Array(PARTICLE_COUNT);
  particleSpeed=new Float32Array(PARTICLE_COUNT);

  particleGeom=new T.BufferGeometry();
  particleAttr=new T.BufferAttribute(particlePositions,3);
  particleAttr.setUsage(T.DynamicDrawUsage);
  particleGeom.setAttribute("position",particleAttr);
  particleGeom.boundingSphere=new T.Sphere(new T.Vector3(0,0,0),3.0);
  trackDisposable(particleGeom);

  const particleMat=trackDisposable(new T.PointsMaterial({
   color:0x2CE8C4,
   size:0.043,
   sizeAttenuation:true,
   transparent:true,
   opacity:0.96,
   depthTest:false,
   depthWrite:false
  }));

  const particles=new T.Points(particleGeom,particleMat);
  particles.frustumCulled=false;
  particles.renderOrder=4;
  particles.updateMatrix();
  particles.matrixAutoUpdate=false;
  particles.visible=false; // so aparecem quando a animacao esta rodando
  scene.add(particles);
  particleObj=particles;

  /* ---------- TEMPORARIOS ---------- */

  tmpDir=new T.Vector3(1,0,0);
  tmpVec=new T.Vector3();
  tmpN=new T.Vector3(1,0,0);
  pointerNdc=new T.Vector2();
  raycaster=new T.Raycaster();
  rayHits=[];

  /* ---------- PONTO SELECIONADO ---------- */

  const selectedGeom=trackDisposable(new T.SphereGeometry(0.07,16,10));
  const selectedPointMat=trackDisposable(new T.MeshBasicMaterial({
   color:0xFF8C42,
   transparent:true,
   opacity:1,
   depthTest:false,
   depthWrite:false
  }));

  selectedPoint=new T.Mesh(selectedGeom,selectedPointMat);
  selectedPoint.visible=false;
  selectedPoint.renderOrder=10;
  scene.add(selectedPoint);

  selectedNormalArrow=new T.ArrowHelper(new T.Vector3(1,0,0),new T.Vector3(0,0,0),0.30,0xFFFFFF,0.10,0.06);
  selectedFieldArrow=new T.ArrowHelper(new T.Vector3(1,0,0),new T.Vector3(0,0,0),0.44,0x1E4FFF,0.15,0.085);

  trackObjectResources(selectedNormalArrow);
  trackObjectResources(selectedFieldArrow);
  emphasizeArrow(selectedNormalArrow);
  emphasizeArrow(selectedFieldArrow);

  selectedNormalArrow.visible=false;
  selectedFieldArrow.visible=false;
  selectedNormalArrow.renderOrder=11;
  selectedFieldArrow.renderOrder=11;
  scene.add(selectedNormalArrow);
  scene.add(selectedFieldArrow);

  /* ---------- EIXOS ---------- */

  const axisGroup=new T.Group();
  axisGroup.position.set(-1.16,-1.02,-0.92);
  const axisL=0.20;

  const negPos=new Float32Array(18);
  negPos[0]=-axisL; negPos[3]=0;
  negPos[7]=-axisL;
  negPos[14]=-axisL;

  const negCol=new Float32Array(18);
  negCol[0]=17/255; negCol[1]=180/255; negCol[2]=1;
  negCol[3]=17/255; negCol[4]=180/255; negCol[5]=1;
  negCol[6]=1; negCol[7]=45/255; negCol[8]=170/255;
  negCol[9]=1; negCol[10]=45/255; negCol[11]=170/255;
  negCol[12]=44/255; negCol[13]=232/255; negCol[14]=196/255;
  negCol[15]=44/255; negCol[16]=232/255; negCol[17]=196/255;

  const negGeom=new T.BufferGeometry();
  negGeom.setAttribute("position",new T.BufferAttribute(negPos,3));
  negGeom.setAttribute("color",new T.BufferAttribute(negCol,3));
  trackDisposable(negGeom);

  const negMat=trackDisposable(new T.LineBasicMaterial({
   vertexColors:true,
   transparent:true,
   opacity:0.22,
   depthWrite:false
  }));

  axisGroup.add(new T.LineSegments(negGeom,negMat));

  const ax=new T.ArrowHelper(new T.Vector3(1,0,0),new T.Vector3(0,0,0),axisL,0x11B4FF,0.047,0.027);
  const ay=new T.ArrowHelper(new T.Vector3(0,1,0),new T.Vector3(0,0,0),axisL,0xFF2DAA,0.047,0.027);
  const az=new T.ArrowHelper(new T.Vector3(0,0,1),new T.Vector3(0,0,0),axisL,0x2CE8C4,0.047,0.027);
  axisGroup.add(ax); axisGroup.add(ay); axisGroup.add(az);

  const sx=createAxisLabel("x","#11B4FF");
  const sy=createAxisLabel("y","#FF2DAA");
  const sz=createAxisLabel("z","#2CE8C4");
  sx.position.set(axisL+0.045,0,0);
  sy.position.set(0,axisL+0.045,0);
  sz.position.set(0,0,axisL+0.045);
  axisGroup.add(sx); axisGroup.add(sy); axisGroup.add(sz);

  trackObjectResources(ax);
  trackObjectResources(ay);
  trackObjectResources(az);

  scene.add(axisGroup);
  freezeStatic(axisGroup);

  /* ---------- MINIMAPA ---------- */

  mapBase=buildMinimapBase(activeMode);
  mapCanvas=stage.createEl("canvas");
  mapCanvas.width=QUALITY.mapSize;
  mapCanvas.height=QUALITY.mapSize;
  mapCanvas.style.cssText=
   "position:absolute;right:10px;top:158px;z-index:8;" +
   `width:${MAP_DISPLAY_SIZE}px;height:${MAP_DISPLAY_SIZE}px;` +
   "pointer-events:none;opacity:.85;border-radius:8px;" +
   "border:1px solid rgba(184,188,200,.22)";
  mapCtx=mapCanvas.getContext("2d",{alpha:false});

  /* ---------- EVENTOS ---------- */

  const canvas=renderer.domElement;

  addListener(canvas,"webglcontextlost",e=>{
   e.preventDefault();
   state.stop=true;
   state.animating=false;
   rotating=false;
   stopRaf();
   playBtnRef.disabled=true;
   rotBtnRef.disabled=true;
   setText(playBtnRef,"\u25B6");
  },false);

  addListener(playBtnRef,"click",()=>{
   if(state.stop)return;
   state.animating=!state.animating;
   if(particleObj)particleObj.visible=state.animating;
   if(state.animating){
    state.accumulator=0;
    state.lastTime=0;
    resetAllParticles(); // renascem espalhadas, nao amontoadas de onde pararam
    ensureRaf();
   }else{
    if(!rotating)stopRaf();
    render(); // redesenha ja sem as particulas
   }
   updatePlayStatus();
  },false);

  addListener(rotBtnRef,"click",()=>{
   if(state.stop)return;
   rotating=!rotating;
   if(rotating){
    state.lastTime=0;
    ensureRaf();
   }else if(!state.animating){
    stopRaf();
    applyGeometryState(true);
    render();
   }
   updateXformButtonStyles();
   updatePlayStatus();
  },false);

  addListener(resetBtnRef,"click",()=>{
   cameraYaw=-0.58;
   cameraPitch=0.40;
   cameraDistance=5.10;
   updateCamera();
   state.animating=false;
   if(particleObj)particleObj.visible=false;
   if(!rotating)stopRaf();
   resetAllParticles();
   clearSelection();
   rotAngle=0;
   applyGeometryState(true);
   updatePlayStatus();
   render();
  },false);

  for(let i=0;i<GEOM_COUNT;i++){
   const idx=i;
   addListener(geomButtons[i],"click",()=>{ setGeometry(idx); },false);
  }

  for(let i=0;i<MODE_COUNT;i++){
   const mode=i;
   addListener(fieldButtons[i],"click",()=>{ applyMode(mode); },false);
  }

  addListener(btnLeft,"click",()=>{ stepX(-1); },false);
  addListener(btnRight,"click",()=>{ stepX(1); },false);
  addListener(btnUp,"click",()=>{ stepZ(1); },false);
  addListener(btnDown,"click",()=>{ stepZ(-1); },false);
  addListener(btnMinus,"click",()=>{ stepSize(1); },false);
  addListener(btnPlus,"click",()=>{ stepSize(-1); },false);

  addListener(canvas,"pointerdown",e=>{
   pointerDown=true;
   pointerMoved=false;
   pointerStartX=e.clientX;
   pointerStartY=e.clientY;
   pointerLastX=e.clientX;
   pointerLastY=e.clientY;
   canvas.setPointerCapture(e.pointerId);
  },false);

  addListener(canvas,"pointermove",e=>{
   if(!pointerDown)return;
   const dx=e.clientX-pointerLastX;
   const dy=e.clientY-pointerLastY;
   pointerLastX=e.clientX;
   pointerLastY=e.clientY;
   const sx2=e.clientX-pointerStartX;
   const sy2=e.clientY-pointerStartY;
   if(sx2*sx2+sy2*sy2>9)pointerMoved=true;
   if(pointerMoved){
    cameraYaw-=dx*0.006;
    cameraPitch-=dy*0.006;
    if(cameraPitch>1.35)cameraPitch=1.35;
    if(cameraPitch<-1.35)cameraPitch=-1.35;
    updateCamera();
    render();
   }
  },false);

  addListener(canvas,"pointerup",e=>{
   if(!pointerDown)return;
   pointerDown=false;
   if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);
   if(pointerMoved)return;

   const rect=canvas.getBoundingClientRect();
   pointerNdc.x=2*(e.clientX-rect.left)/rect.width-1;
   pointerNdc.y=1-2*(e.clientY-rect.top)/rect.height;
   raycaster.setFromCamera(pointerNdc,camera);

   rayHits.length=0;
   raycaster.intersectObject(surfaceMesh,false,rayHits);

   if(rayHits.length>0){
    const hit=rayHits[0];
    tmpVec.copy(hit.point);
    let nx=1,ny=0,nz=0;
    if(hit.face&&hit.face.normal){
     nx=hit.face.normal.x;
     ny=hit.face.normal.y;
     nz=hit.face.normal.z;
    }
    selectFromWorld(tmpVec.x,tmpVec.y,tmpVec.z,nx,ny,nz);
    render();
   }
  },false);

  addListener(canvas,"pointercancel",e=>{
   pointerDown=false;
   if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);
  },false);

  addListener(canvas,"wheel",e=>{
   e.preventDefault();
   cameraDistance*=Math.exp(e.deltaY*0.001);
   if(cameraDistance<3.20)cameraDistance=3.20;
   if(cameraDistance>8.50)cameraDistance=8.50;
   updateCamera();
   render();
  },{passive:false});

  addListener(document,"visibilitychange",()=>{
   if(document.visibilityState!=="visible")stopRaf();
   else ensureRaf();
   updatePlayStatus();
  },false);

  state.observer=new IntersectionObserver(entries=>{
   const entry=entries[entries.length-1];
   state.visible=!!(entry&&entry.isIntersecting&&entry.intersectionRatio>=0.02);
   if(state.visible)ensureRaf();
   else stopRaf();
   updatePlayStatus();
  },{threshold:[0,0.02,0.25]});
  state.observer.observe(stage);

  state.resizeObserver=new ResizeObserver(()=>{
   if(recalcRendererSize())render();
  });
  state.resizeObserver.observe(stage);

  /* ---------- ESTADO INICIAL ---------- */

  resetAllParticles();
  applyGeometryState(true);
  updateGeomButtonStyles();
  updateModeButtonStyles();
  updateXformButtonStyles();

  playBtnRef.disabled=false;
  resetBtnRef.disabled=false;
  rotBtnRef.disabled=false;
  loading.remove();
  recalcRendererSize();
  overlayDirty=true;
  updatePlayStatus();
  render();
 }

 loadThreeR128().then(initThree).catch(err=>{
  if(window.__threeR128LoadPromise===threeLoadPromise)window.__threeR128LoadPromise=undefined;
  showFatal(err&&err.message?err.message:String(err));
 });
}
